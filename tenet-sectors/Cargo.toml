[package]
name = "tenet-sectors"
version = "0.1.0"
description = "Fusion-rule providers and sector types for TeNeT"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tenet_sectors"
path = "src/lib.rs"

[features]
default = []
racah-generated = ["racah/cgc-gen"]

[dependencies]
smallvec = { version = "1", features = ["const_generics", "union"] }
num-complex = "0.4"
num-traits = "0.2"
racah = { git = "https://github.com/Ryo-wtnb11/racah", rev = "a5f91940ab1ea9998f2b58bf7525e7fa2bc24224" }
