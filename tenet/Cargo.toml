[package]
name = "tenet-rs"
version = "0.1.1"
description = "Symmetric tensors and tensor-network operations"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tenet"
path = "src/lib.rs"

[features]
default = ["cpu-faer"]
cpu-faer = ["tenet-dense/cpu-faer", "tenet-tensors/cpu-faer", "tenet-matrixalgebra/cpu-faer"]
cpu-blas = ["tenet-dense/cpu-blas", "tenet-tensors/cpu-blas", "tenet-matrixalgebra/cpu-blas"]
blas-accelerate = ["tenet-dense/blas-accelerate", "tenet-tensors/blas-accelerate", "tenet-matrixalgebra/blas-accelerate"]
blas-openblas = ["tenet-dense/blas-openblas", "tenet-tensors/blas-openblas", "tenet-matrixalgebra/blas-openblas"]
blas-mkl = ["tenet-dense/blas-mkl", "tenet-tensors/blas-mkl", "tenet-matrixalgebra/blas-mkl"]
provider-inject = ["tenet-dense/provider-inject", "tenet-tensors/provider-inject"]
cuda = ["tenet-dense/cuda", "tenet-tensors/cuda"]
racah-generated = ["tenet-core/racah-generated", "tenet-tensors/racah-generated"]

[dependencies]
num-complex = "0.4"
rayon = "1.10"
smallvec = { version = "1", features = ["const_generics", "union"] }
tenet-core = { version = "0.1.1", path = "../tenet-core" }
tenet-dense = { version = "0.1.1", path = "../tenet-dense", default-features = false }
tenet-matrixalgebra = { version = "0.1.1", path = "../tenet-matrixalgebra", default-features = false }
tenet-operations = { version = "0.1.1", path = "../tenet-operations", default-features = false }
tenet-tensors = { version = "0.1.1", path = "../tenet-tensors", default-features = false }

[lints.clippy]
# Edition 2024 (merged doctests) makes clippy suggest let-chains for nested
# `if let`. Why-not apply them: the workspace's 2021 rustfmt style cannot
# format let-chains, and the 2024 style would reformat the whole crate.
collapsible_if = "allow"
