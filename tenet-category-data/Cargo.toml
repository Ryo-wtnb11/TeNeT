[package]
name = "tenet-category-data"
version = "0.1.1"
description = "Fusion-category data tables for TeNeT"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tenet_category_data"
path = "src/lib.rs"

[dependencies]
num-complex = "0.4"
smallvec = { version = "1", features = ["const_generics", "union"] }
tenet-sectors = { version = "0.1.1", path = "../tenet-sectors" }

[dev-dependencies]
# No default provider: a workspace build selects exactly one BLAS provider
# through the `tenet-rs` member (default `blas-openblas`, or an explicit
# `--no-default-features --features blas-*`), and a second default here would
# collide with it at compile time.
tenet = { package = "tenet-rs", version = "0.1.1", path = "../tenet", default-features = false, features = ["cpu-blas"] }
