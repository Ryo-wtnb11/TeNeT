[package]
name = "tenet-tensors"
version = "0.1.1"
description = "Symmetric-tensor operations for TeNeT"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tenet_tensors"
path = "src/lib.rs"

[features]
default = ["cpu-faer"]
cpu-faer = ["tenet-dense/cpu-faer", "tenet-operations/cpu-faer"]
cpu-blas = ["tenet-dense/cpu-blas", "tenet-operations/cpu-blas"]
blas-accelerate = ["tenet-dense/blas-accelerate", "tenet-operations/blas-accelerate"]
blas-openblas = ["tenet-dense/blas-openblas", "tenet-operations/blas-openblas"]
blas-mkl = ["tenet-dense/blas-mkl", "tenet-operations/blas-mkl"]
provider-inject = ["tenet-dense/provider-inject", "tenet-operations/provider-inject"]
cuda = ["tenet-dense/cuda", "tenet-operations/cuda"]
racah-generated = ["tenet-core/racah-generated"]

[dependencies]
tenet-core = { version = "0.1.1", path = "../tenet-core" }
tenet-operations = { version = "0.1.1", path = "../tenet-operations", default-features = false }
tenet-dense = { version = "0.1.1", path = "../tenet-dense", default-features = false }
strided-kernel.workspace = true
# Fast non-cryptographic hasher for internal plan/structure/recoupling caches
# keyed on fusion-tree structure (no untrusted input); std SipHash is slow here.
rustc-hash = "2"
lru = "0.12"
# Parallel tree-transform plan compile runs inside the runtime's CPU pool
# (`tenet_operations::host_pool`); rayon is already in every build through
# strided-kernel's "parallel" feature, so this adds no dependency weight.
rayon = "1.10"
num-traits = "0.2"
num-complex = "0.4"
smallvec = { version = "1", features = ["const_generics", "union"] }

[dev-dependencies]
tenet-sectors = { version = "0.1.1", path = "../tenet-sectors" }
