[workspace]
members = ["tenet", "tenet-category-data", "tenet-core", "tenet-dense", "tenet-krylov", "tenet-macros", "tenet-matrixalgebra", "tenet-network", "tenet-operations", "tenet-sectors", "tenet-tensors"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ryo-wtnb11/TeNeT"

[patch."https://github.com/tensor4all/tenferro-rs"]
tenferro-cpu = { path = "../tenferro-rs/crates/tenferro-cpu" }
tenferro-linalg = { path = "../tenferro-rs/crates/tenferro-linalg" }
tenferro-runtime = { path = "../tenferro-rs/crates/tenferro-runtime" }
