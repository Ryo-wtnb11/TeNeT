[workspace]
members = ["symtn", "symtn-category-data", "symtn-core", "symtn-dense", "symtn-macros", "symtn-matrixalgebra", "symtn-network", "symtn-operations", "symtn-sectors", "symtn-tensors"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ryo-wtnb11/symtn-rs"

[workspace.dependencies]
strided-kernel = { version = "0.4.4", features = ["parallel"] }
