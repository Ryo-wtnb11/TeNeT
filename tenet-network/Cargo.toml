[package]
name = "tenet-network"
version = "0.1.0"
description = "Tensor-network contraction planning and execution for TeNeT"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tenet_network"
path = "src/lib.rs"

[features]
default = ["cpu-faer"]
cpu-faer = ["tenet/cpu-faer"]
cpu-blas = ["tenet/cpu-blas"]
blas-accelerate = ["tenet/blas-accelerate"]
blas-openblas = ["tenet/blas-openblas"]
blas-mkl = ["tenet/blas-mkl"]
provider-inject = ["tenet/provider-inject"]
racah-generated = ["tenet/racah-generated"]
cuda = ["tenet/cuda"]
# Wraps the `opt-einsum-path` crate (Apache-2.0) as a
# `DenseContractionOptimizer` backend (optimal / dp / branch / random-greedy).
opt-path = ["dep:opt-einsum-path", "tenet/opt-path"]
# Calls the installed Python `cotengra` package as an external path planner.
cotengra-python = ["dep:command-group", "dep:libc", "dep:serde_json", "tenet/cotengra-python"]

[dependencies]
command-group = { version = "5.0.1", optional = true }
tenet = { package = "tenet-rs", path = "../tenet", default-features = false }
tenet-macros = { path = "../tenet-macros" }
opt-einsum-path = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }
# O(1) LRU (HashMap + intrusive linked list), the Rust analog of the
# `LRUCache.jl` that TensorKit uses for its global caches. Replaces the
# linear-scan `VecDeque` LRU whose touch was O(capacity) per plan-cache hit.
lru = "0.12"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
