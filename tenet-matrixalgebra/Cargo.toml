[package]
name = "tenet-matrixalgebra"
version = "0.1.1"
description = "Blockwise matrix factorizations for TeNeT"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tenet-core = { version = "0.1.1", path = "../tenet-core" }
tenet-dense = { version = "0.1.1", path = "../tenet-dense", default-features = false }
tenet-tensors = { version = "0.1.1", path = "../tenet-tensors", default-features = false }
num-complex = "0.4"
num-traits = "0.2"
rustc-hash = "2"

[dev-dependencies]
# Generic test fixtures implement the infallible symbol tier, which is
# test-only (#1854).
tenet-core = { version = "0.1.1", path = "../tenet-core", features = ["testing"] }

[features]
default = ["cpu-faer"]
cpu-faer = ["tenet-tensors/cpu-faer"]
cpu-blas = ["tenet-tensors/cpu-blas"]
blas-accelerate = ["tenet-tensors/blas-accelerate"]
blas-openblas = ["tenet-tensors/blas-openblas"]
blas-mkl = ["tenet-tensors/blas-mkl"]
# Test-only: admits `SUNFusionRule` so checked-Generic SU(3) fixtures run here.
racah-generated = ["tenet-tensors/racah-generated"]
