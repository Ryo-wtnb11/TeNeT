[package]
name = "tenet-macros"
version = "0.1.1"
description = "The contract! index-notation macro of tenet-network"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tenet_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "proc-macro"] }

[dev-dependencies]
trybuild = "1"
