name: OpenBLAS Contract

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 3'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'tenet-dense/**'
      - 'tenet/src/runtime.rs'
      - 'tenet-operations/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/openblas.yml'
      - '.github/actions/cargo-build-script-cache/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  openblas-contract:
    name: OpenBLAS compile contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: backend-openblas
      - uses: ./tenet/.github/actions/cargo-build-script-cache
        with:
          key: backend-openblas
      - run: cargo check --locked --workspace --all-targets --no-default-features --features blas-openblas
        working-directory: tenet
