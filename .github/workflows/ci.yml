name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Drafts skip CI (job `if`s below); ready_for_review starts the first run.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Why-not keep default DWARF: heavy Linux tests do not inspect it, while its
  # artifacts exhaust hosted-runner disk and linker memory.
  # Why-not delete more image paths: that treats the symptom and can destabilize
  # hosted images. Why-not coverage: llvm-cov owns its instrumentation contract.
  CI_HEAVY_TEST_DEBUG: '0'
  # Test steps pass `--tests` (every target with `test = true`: what `cargo
  # test` runs) and `--doc` separately. Why-not the default selection: it also
  # compiles and links every example, which are timing programs no test job
  # runs; the lint job's `clippy --all-targets` already compiles them.

jobs:
  # One runner for the light lint gates: GitHub's per-account job concurrency,
  # not their runtime, is the CI bottleneck. Each step still reports on its own.
  lint:
    name: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      # MSRV first so the stable install below remains the default toolchain;
      # the MSRV step selects 1.96.0 via RUSTUP_TOOLCHAIN.
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: lint
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --check
        working-directory: tenet
      # The workspace is Clippy-clean; deny warnings so new findings cannot silently accumulate.
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: tenet
      - name: cargo check (Rust 1.96)
        if: ${{ !cancelled() }}
        run: cargo check --workspace
        working-directory: tenet
        env:
          RUSTUP_TOOLCHAIN: 1.96.0

  backend-contract-linux:
    name: backend contract (linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: backend-linux
      # Former `fail-fast: false` matrix rows: `!cancelled()` keeps every
      # feature's signal in one run.
      - name: check cpu-blas-core
        if: ${{ !cancelled() }}
        run: cargo check --workspace --all-targets --no-default-features --features "cpu-blas"
        working-directory: tenet
      - name: check mkl
        if: ${{ !cancelled() }}
        run: cargo check --workspace --all-targets --no-default-features --features "blas-mkl"
        working-directory: tenet
      - name: check provider-inject
        if: ${{ !cancelled() }}
        run: cargo check --workspace --all-targets --no-default-features --features "provider-inject"
        working-directory: tenet

  backend-contract-accelerate:
    name: backend contract (accelerate)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Accelerate build toolchain
        run: brew install gcc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: backend-accelerate
      - run: cargo check --workspace --all-targets --no-default-features --features "blas-accelerate"
        working-directory: tenet
      # The compile-only checks never execute the direct full-SVD path a BLAS
      # provider takes (#1163). `accelerate` carries the runtime gate because
      # its vendor is the system framework, so linking a test binary needs no
      # setup its runner lacks; `cpu-blas` selects no vendor at all. Scoped to
      # the two crates that own the path: the workspace suite is red here for
      # an unrelated 1-ULP equality in tenet-rs's truncated-SVD adjoint gate.
      - name: Run the BLAS full-SVD suites
        working-directory: tenet
        run: |
          cargo test -p tenet-dense -p tenet-matrixalgebra --no-default-features --features blas-accelerate --tests
          cargo test -p tenet-dense -p tenet-matrixalgebra --no-default-features --features blas-accelerate --doc

  # opt-path (wraps opt-einsum-path) and cotengra-python (shells out to an
  # installed Python `cotengra`) have real code but, unlike the backend rows
  # above, no matrix coverage anywhere in CI (#153). Both need a host
  # execution backend to run anything, so cpu-faer rides along. Unlike
  # backend-contract this runs the actual test suite, not just `cargo
  # check`: the point is to start exercising optimizer_fallback.rs /
  # plan_cache.rs's feature-gated tests, which today never run in CI.
  # cotengra-python is build + unit tests only — its one test that shells
  # out to Python (`runs_installed_cotengra_when_requested`) early-returns
  # unless `TENET_RUN_COTENGRA_PYTHON_TEST` is set, so no Python env is
  # needed here.
  # Why-not stop at the first red step: each step was its own matrix row with
  # `fail-fast: false`, so `!cancelled()` keeps every package's signal in one
  # run. Why-not a single feature union: that would stop testing the
  # `not(feature = ...)` paths of the other feature.
  feature-contract-network-optimizers:
    name: feature contract (network optimizers)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: feature-network-optimizers
      - uses: ./tenet/.github/actions/cargo-build-script-cache
        with:
          key: feature-network-optimizers
      # The `lint` job's clippy step only lints default features (#1450), so a
      # lint that only fires under one of these non-default feature sets
      # (e.g. the racah-generated `obfuscated_if_else`s in typed.rs) never ran
      # in CI. Clippy uses `--all-targets`, mirroring that step's scope, while
      # a test step may filter to fewer targets.
      - name: clippy tenet-network (opt-path)
        if: ${{ !cancelled() }}
        run: cargo clippy -p tenet-network --no-default-features --features "opt-path,cpu-faer" --all-targets -- -D warnings
        working-directory: tenet
      - name: test tenet-network (opt-path)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p tenet-network --no-default-features --features "opt-path,cpu-faer" --tests
          cargo test -p tenet-network --no-default-features --features "opt-path,cpu-faer" --doc
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: clippy tenet-network (cotengra-python)
        if: ${{ !cancelled() }}
        run: cargo clippy -p tenet-network --no-default-features --features "cotengra-python,cpu-faer" --all-targets -- -D warnings
        working-directory: tenet
      - name: test tenet-network (cotengra-python)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p tenet-network --no-default-features --features "cotengra-python,cpu-faer" --tests
          cargo test -p tenet-network --no-default-features --features "cotengra-python,cpu-faer" --doc
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}

  # racah-generated: one job so the Racah dependency chain compiles once for
  # all packages instead of once per matrix row.
  feature-contract-racah:
    name: feature contract (racah-generated, all crates)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: feature-racah-all
      - uses: ./tenet/.github/actions/cargo-build-script-cache
        with:
          key: feature-racah-all
      # The `lint` job's clippy step only lints default features (#1450), so a
      # lint that only fires under one of these non-default feature sets
      # (e.g. the racah-generated `obfuscated_if_else`s in typed.rs) never ran
      # in CI. Clippy uses `--all-targets`, mirroring that step's scope, while
      # a test step may filter to fewer targets.
      - name: clippy tenet-sectors (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo clippy -p tenet-sectors --no-default-features --features "racah-generated" --all-targets -- -D warnings
        working-directory: tenet
      - name: clippy tenet-tensors (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo clippy -p tenet-tensors --no-default-features --features "racah-generated,cpu-faer" --all-targets -- -D warnings
        working-directory: tenet
      - name: clippy tenet-matrixalgebra (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo clippy -p tenet-matrixalgebra --no-default-features --features "racah-generated,cpu-faer" --all-targets -- -D warnings
        working-directory: tenet
      - name: clippy tenet-rs (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo clippy -p tenet-rs --no-default-features --features "racah-generated,cpu-faer" --all-targets -- -D warnings
        working-directory: tenet
      - name: clippy tenet-network (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo clippy -p tenet-network --no-default-features --features "racah-generated,cpu-faer" --all-targets -- -D warnings
        working-directory: tenet
      - name: test tenet-sectors (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo test -p tenet-sectors --no-default-features --features "racah-generated"
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: test tenet-tensors (racah-generated)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p tenet-tensors --no-default-features --features "racah-generated,cpu-faer" --tests
          cargo test -p tenet-tensors --no-default-features --features "racah-generated,cpu-faer" --doc
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: test tenet-matrixalgebra (racah-generated)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p tenet-matrixalgebra --no-default-features --features "racah-generated,cpu-faer" --tests
          cargo test -p tenet-matrixalgebra --no-default-features --features "racah-generated,cpu-faer" --doc
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      # tenet-rs (the `tenet` crate) `tests/*.rs` files gated
      # `#![cfg(feature = "racah-generated")]` compiled to nothing in CI
      # (#1293); `--tests` runs those integration tests and the lib unit tests,
      # not doctests.
      - name: test tenet-rs --tests (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo test -p tenet-rs --no-default-features --features "racah-generated,cpu-faer" --tests
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: test tenet-network --test checked_generic_network (racah-generated)
        if: ${{ !cancelled() }}
        run: cargo test -p tenet-network --no-default-features --features "racah-generated,cpu-faer" --test checked_generic_network
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: Run checked lazy transform defining regression
        if: ${{ !cancelled() }}
        working-directory: tenet
        run: |
          test_output="$(mktemp)"
          trap 'rm -f "$test_output"' EXIT
          cargo test -p tenet-rs --lib --no-default-features --features cpu-faer,racah-generated \
            typed::representation_gates::lazy_adjoint::checked_generic_lazy_transforms_do_not_materialize_uncached_input \
            -- --exact 2>&1 | tee "$test_output"
          grep -Eq '^test result: ok\. 1 passed;' "$test_output"
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}

  # #1531: every Host eager operation must enter its runtime's CPU pool (an
  # execution lease or an explicit guard). `tenet_scope_audit` turns a Host
  # replay/compile/strided site reached with no entered pool on a caller
  # thread into a panic, so an operation that forgets the entry fails here
  # instead of silently running on Rayon's global pool. Own job: the cfg
  # changes RUSTFLAGS and would otherwise invalidate the test job's build
  # cache.
  host-pool-audit:
    name: host pool entry audit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: host-pool-audit
      - uses: ./tenet/.github/actions/cargo-build-script-cache
        with:
          key: host-pool-audit
      - run: |
          cargo test -p tenet-rs -p tenet-network -p tenet-krylov --tests
          cargo test -p tenet-rs -p tenet-network -p tenet-krylov --doc
        working-directory: tenet
        env:
          RUSTFLAGS: --cfg tenet_scope_audit
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}

  cuda-check:
    name: CUDA compile contract
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Why: #436 — Jimver/cuda-toolkit's network setup can stall indefinitely,
    # making an unrelated PR look unstable rather than failing fast and
    # pointing at the toolkit setup step.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - name: Install CUDA toolkit
        id: cuda-toolkit
        timeout-minutes: 12
        uses: Jimver/cuda-toolkit@v0.2.28
        with:
          method: network
      - name: Diagnose CUDA toolkit setup
        # Runs whether the setup step above succeeded, failed, or timed out,
        # so a stuck/failed toolkit install is attributable and distinct from
        # a later TeNeT cuda-feature compile failure.
        if: always()
        run: |
          set -uo pipefail
          echo "cuda-toolkit step outcome: ${{ steps.cuda-toolkit.outcome }}"
          echo "CUDA_PATH=${CUDA_PATH:-<unset>}"
          echo "PATH=${PATH}"
          if command -v nvcc >/dev/null 2>&1; then
            nvcc --version
          else
            echo "nvcc not found on PATH"
          fi
          if [ "${{ steps.cuda-toolkit.outcome }}" != "success" ]; then
            echo "::error::CUDA toolkit setup (Jimver/cuda-toolkit) did not complete successfully or timed out; this is a toolkit/network setup failure, not a TeNeT cuda feature compile failure." >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: backend-cuda
      - run: cargo check --workspace --all-targets --no-default-features --features cuda,cpu-faer
        working-directory: tenet
      # GPU-free: the single-stream configuration (#1391) is set and checked
      # before any device access.
      - run: cargo test -p tenet-dense --no-default-features --features cuda,cpu-faer --test cuda_stream_config_conflict --test cuda_stream_config_single
        working-directory: tenet

  test-linux:
    name: cargo test (ubuntu-latest)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./tenet/.github/actions/cargo-build-script-cache
        with:
          key: test-linux
      # Unit and integration tests execute in the coverage job (#1742); it
      # cannot run doctests on stable, so they stay here.
      - name: Run workspace doctests
        run: cargo test --workspace --doc
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: Run quickstart example
        run: cargo run -p tenet-network --example quickstart
        working-directory: tenet
        env:
          CARGO_PROFILE_DEV_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      # Rustdoc gate (#579): the tenet facade's docs are a maintained public
      # surface with per-item provenance (tenet/references.md), so broken
      # intra-doc links or malformed doc markup fail the build here rather
      # than rotting silently. Doctests themselves run in the step above.
      - name: Build tenet docs with warnings denied
        run: cargo doc -p tenet-rs --no-deps
        working-directory: tenet
        env:
          CARGO_PROFILE_DEV_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
          RUSTDOCFLAGS: -D warnings
      - name: Check the backend-selection diagnostic
        run: |
          set -euo pipefail
          if cargo check --workspace --no-default-features 2>no-backend.log; then
            echo "no-default-features unexpectedly compiled" >&2
            exit 1
          fi
          grep -F "tenet-operations requires a host execution backend" no-backend.log
        working-directory: tenet
        env:
          CARGO_PROFILE_DEV_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}

  test-macos:
    name: cargo test (macos-latest)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: workspace-test-debug0-v1
      - uses: ./tenet/.github/actions/cargo-build-script-cache
        with:
          key: test-macos
      # Why not serialize every test job: only tenet-tensors unit tests observe
      # process-global cache snapshots, so keep the rest of the workspace parallel.
      - name: Run tenet-tensors tests with isolated cache snapshots
        run: cargo test -p tenet-tensors --tests -- --test-threads=1
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: Run remaining workspace tests
        run: cargo test --workspace --exclude tenet-tensors --tests
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: Run workspace doctests
        run: cargo test --workspace --doc
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}

  coverage:
    name: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tenet
      - name: Record source revisions
        run: |
          git -C tenet log -1 --format='TeNeT %H'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tenet
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Coverage instrumentation produces a large, short-lived target tree.
          # Restoring it alongside the runner image exhausted disk during link.
          cache-targets: false
      - uses: taiki-e/install-action@cargo-llvm-cov
      # This job is the Linux unit/integration test runner (#1742). Why not
      # serialize every test: only tenet-tensors unit tests observe
      # process-global cache snapshots, so keep the rest of the workspace parallel.
      - name: Run tenet-tensors tests with isolated cache snapshots
        run: cargo llvm-cov --no-report -p tenet-tensors --tests -- --test-threads=1
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: Run remaining workspace tests
        run: cargo llvm-cov --no-report --workspace --exclude tenet-tensors --tests
        working-directory: tenet
        env:
          CARGO_PROFILE_TEST_DEBUG: ${{ env.CI_HEAVY_TEST_DEBUG }}
      - name: Generate coverage JSON
        run: cargo llvm-cov report --json --output-path coverage.json
        working-directory: tenet
      # Changed-line coverage is printed for review only; crate floors gate.
      - name: Check per-crate coverage floors
        run: |
          set -euo pipefail
          diff_base=""
          if [ -n "${BASE_SHA}" ]; then
            if git fetch --no-tags --depth=1 origin "${BASE_SHA}"; then
              diff_base="${BASE_SHA}"
            else
              echo "base fetch failed; skipping changed-line report"
            fi
          fi
          python3 scripts/check-coverage.py coverage.json ${diff_base:+--diff-base "${diff_base}"}
        working-directory: tenet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
