[package]
name = "symtn-core"
version = "0.1.1"
description = "Core tensor data structures for symtn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "symtn_core"
path = "src/lib.rs"

[features]
default = []
racah-generated = ["symtn-sectors/racah-generated"]
# Unstable test oracles (`symtn_core::testing`) for sibling crates' tests; not
# part of the public API.
testing = ["symtn-sectors/testing"]

[dependencies]
symtn-sectors = { version = "0.1.1", path = "../symtn-sectors" }
smallvec = { version = "1", features = ["const_generics", "union"] }
# Fast non-cryptographic hasher for internal maps keyed on fusion-tree /
# block structure (small integer sequences, no untrusted input) — the Rust
# analog of Julia's fast `Dict` hash; std's SipHash is needlessly slow here.
rustc-hash = "2"
# The one bounded concurrent cache behind symtn's four structure caches
# (#2014): byte-weighted, sharded, single-flight misses. Default features off:
# the caches pass their own hasher, and std locks suffice.
quick_cache = { version = "0.7", default-features = false }

[dev-dependencies]
# Enables `testing` for this crate's own integration tests
# (tests/identity_transform_allocations.rs).
symtn-core = { path = ".", features = ["testing"] }
# Zero-cost-claim canary (#153): a tiny hash/eq microbench for the
# mult-free `FusionTreeKey` path (see benches/fusion_tree_key.rs; the
# companion `size_of` assert lives in src/tests.rs, next to the type it
# pins). Only pulled in for `cargo bench`, never a normal build.
criterion = { version = "0.5", default-features = false }
# Genuinely complex `Scalar` fixtures for the recoupling engine tests.
num-complex = "0.4"

[[bench]]
name = "fusion_tree_key"
harness = false
