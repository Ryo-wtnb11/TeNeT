[package]
name = "symtn-operations"
version = "0.1.1"
description = "Symmetry-free tensor operations for symtn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
symtn-core = { version = "0.1.1", path = "../symtn-core" }
symtn-dense = { version = "0.1.1", path = "../symtn-dense", default-features = false }
num-complex = "0.4"
num-traits = "0.2"
smallvec = { version = "1", features = ["const_generics", "union"] }
strided-kernel.workspace = true
# Tree-transform replay parallelism uses rayon directly: strided-kernel's
# unconditional "parallel" feature above already pulls rayon into every
# build, so this adds no dependency weight. Replay, compile and strided
# regions run inside the runtime's one CPU pool (`host_pool`).
rayon = "1.10"
rustc-hash = "2"

[features]
default = ["cpu-faer"]
cpu-faer = ["symtn-dense/cpu-faer"]
cpu-blas = ["symtn-dense/cpu-blas"]
blas-accelerate = ["symtn-dense/blas-accelerate"]
blas-openblas = ["symtn-dense/blas-openblas"]
blas-mkl = ["symtn-dense/blas-mkl"]
provider-inject = ["symtn-dense/provider-inject"]
# Unstable, internal: reference oracle for tree-transform replay (per-block
# strided driver and scalar recoupling); production replay never uses it
# (#1767). It also adds `HostKernelAdapter::recoupling_src_times_u_transpose`,
# a required trait method, so only in-workspace tests/benches may enable it.
testing = []
cuda = ["symtn-dense/cuda"]

[dev-dependencies]
symtn-operations = { path = ".", default-features = false, features = ["testing"] }
# Microbench for the #230 non-contiguous strided-combine regime. Informational,
# not a pass/fail gate (shared CI runners are too noisy); the real gate is the
# size_of canary in host_scalar_kernels.rs. Only pulled in for `cargo bench`.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "strided_combine"
harness = false

[[bench]]
name = "permute_u1_many"
harness = false

[[bench]]
name = "tree_transform_lowering"
harness = false

[lints.rust]
# `symtn_scope_audit`: CI-only coverage audit of Host pool entry (host_pool.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(symtn_scope_audit)"] }
